syntax = "proto3";

package ecommerce.order.v1;

import "ecommerce/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/HuzaifaMH/go-ecommerce-microservices/gen/ecommerce/order/v1;orderv1";

// OrderService manages the order lifecycle. Creating an order starts an
// asynchronous saga, so CreateOrder returns the order in PENDING state.
service OrderService {
  // CreateOrder accepts an order. It is idempotent per idempotency_key.
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  // CancelOrder cancels an order that is not yet confirmed.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_STOCK_RESERVED = 2;
  ORDER_STATUS_CONFIRMED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

message OrderItem {
  string sku = 1;
  int32 quantity = 2;
  ecommerce.common.v1.Money unit_price = 3;
}

message Order {
  string id = 1;
  string customer_id = 2;
  repeated OrderItem items = 3;
  ecommerce.common.v1.Money total = 4;
  OrderStatus status = 5;
  // Set when status is ORDER_STATUS_CANCELLED.
  string cancel_reason = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderItem items = 2;
  // Client-generated key; repeating a request with the same key returns the
  // original order instead of creating a duplicate.
  string idempotency_key = 3;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message CancelOrderRequest {
  string id = 1;
  string reason = 2;
}

message CancelOrderResponse {
  Order order = 1;
}
