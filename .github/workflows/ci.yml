name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      # Docker is available on the runner, so testcontainers-based integration tests run here.
      - name: Test (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          make tools
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: make proto-lint
      - name: Generated code is up to date
        run: |
          make proto
          git diff --exit-code -- gen || (echo "::error::gen/ is stale; run 'make proto' and commit the result" && exit 1)
      - name: Breaking changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:refs/remotes/origin/main
          if git cat-file -e origin/main:api/proto/buf.yaml 2>/dev/null; then
            buf breaking api/proto --against '.git#ref=refs/remotes/origin/main,subdir=api/proto'
          else
            echo "main has no protobuf module yet; skipping breaking-change check"
          fi

  sqlc:
    name: sqlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tools
        run: make tools
      - name: Generated query code is up to date
        run: |
          make sqlc
          git diff --exit-code -- 'services/*/internal/adapters/postgres/sqlcgen' || (echo "::error::sqlcgen is stale; run 'make sqlc' and commit the result" && exit 1)

  docker:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [inventory, payment, order, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the full stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Run end-to-end tests
        run: go test -tags e2e -count=1 -timeout 10m ./test/e2e/...
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  compose:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml config -q
