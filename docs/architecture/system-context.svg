<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="600" fill="#0f172a">Level 1: System context</text>
  <text x="20" y="48" font-size="12" fill="#475569">Who uses the system and what it depends on. Blue = the system, grey = people and external systems.</text>

  <!-- person -->
  <circle cx="110" cy="170" r="22" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="62" y="198" width="96" height="48" rx="12" fill="#e2e8f0" stroke="#64748b"/>
  <text x="110" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Customer</text>
  <text x="110" y="282" text-anchor="middle" font-size="12" fill="#475569">places and tracks orders</text>

  <!-- system -->
  <rect x="320" y="120" width="260" height="170" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">E-Commerce Backend</text>
  <text x="450" y="195" text-anchor="middle" font-size="12" fill="#1e3a8a">Go microservices</text>
  <text x="450" y="215" text-anchor="middle" font-size="12" fill="#1e3a8a">orders · stock · payments · notifications</text>
  <text x="450" y="260" text-anchor="middle" font-size="12" fill="#1e3a8a">REST edge, gRPC + JetStream inside</text>

  <!-- externals -->
  <rect x="680" y="70" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="775" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Identity provider</text>
  <text x="775" y="117" text-anchor="middle" font-size="12" fill="#475569">issues RS256 JWTs, serves JWKS</text>

  <rect x="680" y="178" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="775" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Payment provider</text>
  <text x="775" y="225" text-anchor="middle" font-size="12" fill="#475569">simulated, behind an interface</text>

  <rect x="680" y="286" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="775" y="314" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Email / SMS gateway</text>
  <text x="775" y="333" text-anchor="middle" font-size="12" fill="#475569">simulated, behind an interface</text>

  <rect x="320" y="340" width="260" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="450" y="365" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Operator</text>
  <text x="450" y="383" text-anchor="middle" font-size="12" fill="#475569">watches Grafana, Jaeger, alerts</text>

  <!-- arrows -->
  <line x1="162" y1="215" x2="320" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="170" y="198" font-size="12" fill="#475569">HTTPS, JWT</text>
  <line x1="580" y1="150" x2="680" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="590" y="116" font-size="12" fill="#475569">fetch JWKS</text>
  <line x1="580" y1="210" x2="680" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="598" y="202" font-size="12" fill="#475569">charge</text>
  <line x1="580" y1="255" x2="680" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="600" y="296" font-size="12" fill="#475569">send</text>
  <line x1="450" y1="340" x2="450" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="462" y="320" font-size="12" fill="#475569">observes</text>
</svg>
