<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- client -->
  <rect x="400" y="16" width="200" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="41" text-anchor="middle" font-size="14" fill="#0f172a">Web / mobile / curl</text>
  <line x1="500" y1="56" x2="500" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="512" y="79" font-size="12" fill="#475569">HTTPS · REST/JSON</text>

  <!-- gateway -->
  <rect x="330" y="92" width="340" height="68" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="500" y="119" text-anchor="middle" font-size="16" font-weight="600" fill="#0c4a6e">api-gateway</text>
  <text x="500" y="141" text-anchor="middle" font-size="12" fill="#0c4a6e">RS256 JWT · rate limiting · request IDs · CORS</text>

  <!-- gateway -> order / inventory (sync gRPC) -->
  <path d="M430 160 V196 H125 V222" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M470 160 V208 H375 V222" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="140" y="190" font-size="12" fill="#475569">gRPC (sync)</text>

  <!-- services -->
  <g font-size="12" fill="#14532d">
    <rect x="20" y="222" width="210" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="125" y="250" text-anchor="middle" font-size="15" font-weight="600">order-service</text>
    <text x="125" y="271" text-anchor="middle">order lifecycle · saga orchestrator</text>
    <text x="125" y="296" text-anchor="middle" fill="#475569">PostgreSQL: orders + outbox</text>

    <rect x="270" y="222" width="210" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="375" y="250" text-anchor="middle" font-size="15" font-weight="600">inventory-service</text>
    <text x="375" y="271" text-anchor="middle">stock · reservations · releases</text>
    <text x="375" y="296" text-anchor="middle" fill="#475569">PostgreSQL: inventory + outbox</text>

    <rect x="520" y="222" width="210" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="625" y="250" text-anchor="middle" font-size="15" font-weight="600">payment-service</text>
    <text x="625" y="271" text-anchor="middle">charges · refunds · idempotency</text>
    <text x="625" y="296" text-anchor="middle" fill="#475569">PostgreSQL: payments + outbox</text>

    <rect x="770" y="222" width="210" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="875" y="250" text-anchor="middle" font-size="15" font-weight="600">notification-service</text>
    <text x="875" y="271" text-anchor="middle">email / SMS · at-least-once</text>
    <text x="875" y="296" text-anchor="middle" fill="#475569">PostgreSQL: notifications + inbox</text>
  </g>

  <!-- bus -->
  <rect x="20" y="410" width="960" height="70" rx="10" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/>
  <text x="500" y="438" text-anchor="middle" font-size="16" font-weight="600" fill="#164e63">NATS JetStream</text>
  <text x="500" y="460" text-anchor="middle" font-size="12" fill="#164e63">durable pull consumers · broker-side de-duplication (Nats-Msg-Id) · commands (cmd.*) and events (evt.*)</text>

  <!-- services <-> bus (async) -->
  <g stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <line x1="125" y1="326" x2="125" y2="410" marker-start="url(#b)" marker-end="url(#b)"/>
    <line x1="375" y1="326" x2="375" y2="410" marker-start="url(#b)" marker-end="url(#b)"/>
    <line x1="625" y1="326" x2="625" y2="410" marker-start="url(#b)" marker-end="url(#b)"/>
    <line x1="875" y1="326" x2="875" y2="410" marker-end="url(#b)"/>
  </g>
  <text x="137" y="372" font-size="12" fill="#0e7490">commands out, replies in</text>
  <text x="387" y="372" font-size="12" fill="#0e7490">reserve / release</text>
  <text x="637" y="372" font-size="12" fill="#0e7490">charge</text>
  <text x="863" y="372" font-size="12" fill="#0e7490" text-anchor="end">order + payment events</text>

  <!-- observability -->
  <rect x="20" y="520" width="960" height="84" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="2 3"/>
  <text x="36" y="542" font-size="12" font-weight="600" fill="#475569">OBSERVABILITY (every service and the gateway)</text>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <rect x="60" y="552" width="200" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="160" y="577">OpenTelemetry traces</text>
    <rect x="300" y="552" width="200" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="400" y="577">Jaeger</text>
    <rect x="540" y="552" width="200" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="640" y="577">Prometheus + 8 alerts</text>
    <rect x="780" y="552" width="180" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="870" y="577">Grafana</text>
  </g>
  <line x1="260" y1="572" x2="300" y2="572" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="572" x2="780" y2="572" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- legend -->
  <line x1="700" y1="36" x2="740" y2="36" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="750" y="40" font-size="12" fill="#475569">synchronous gRPC</text>
  <line x1="700" y1="58" x2="740" y2="58" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="750" y="62" font-size="12" fill="#0e7490">asynchronous (outbox → JetStream)</text>
</svg>
