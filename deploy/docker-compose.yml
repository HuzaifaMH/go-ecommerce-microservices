name: ecommerce

# Every application service exports traces to Jaeger over OTLP/gRPC.
# Unset this variable and tracing is switched off.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: inventory
    environment:
      <<: *otel
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory?sslmode=disable
      NATS_URL: nats://nats:4222
      SEED_DEMO_DATA: "true"
      LOG_FORMAT: text
    ports:
      - "9090:9090" # gRPC
      - "8081:8080" # health endpoints
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

  payment:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: payment
    environment:
      <<: *otel
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_FORMAT: text
    ports:
      - "9091:9090" # gRPC
      - "8082:8080" # health endpoints
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

  order:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: order
    environment:
      <<: *otel
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      NATS_URL: nats://nats:4222
      INVENTORY_GRPC_ADDR: inventory:9090
      LOG_FORMAT: text
    ports:
      - "9092:9090" # gRPC
      - "8083:8080" # health endpoints
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      inventory:
        condition: service_started

  notification:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: notification
    environment:
      <<: *otel
      DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_FORMAT: text
    ports:
      - "9093:9090" # gRPC
      - "8084:8080" # health endpoints
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: gateway
    environment:
      <<: *otel
      # Development only: the gateway mints its own tokens at POST /dev/token.
      # In any real deployment set JWT_ISSUER, JWT_AUDIENCE and JWT_JWKS_URL
      # (or JWT_PUBLIC_KEY_FILE) instead, and never DEV_AUTH.
      DEV_AUTH: "true"
      ORDER_GRPC_ADDR: order:9090
      INVENTORY_GRPC_ADDR: inventory:9090
      NOTIFICATION_GRPC_ADDR: notification:9090
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      LOG_FORMAT: text
    ports:
      - "8080:8080" # the public REST API
      - "9100:9100" # internal /metrics (published for local development only; never expose it publicly)
    depends_on:
      order:
        condition: service_started
      inventory:
        condition: service_started
      notification:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "16686:16686" # UI

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9099:9090" # UI (9090 is the inventory service's gRPC port on the host)

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      # Local development: anyone can view the dashboards without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecommerce.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  nats-data:
  postgres-data:
