name: ecommerce

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: inventory
    environment:
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory?sslmode=disable
      NATS_URL: nats://nats:4222
      SEED_DEMO_DATA: "true"
      LOG_FORMAT: text
    ports:
      - "9090:9090" # gRPC
      - "8081:8080" # health endpoints
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

  payment:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: payment
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_FORMAT: text
    ports:
      - "9091:9090" # gRPC
      - "8082:8080" # health endpoints
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

  order:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: order
    environment:
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      NATS_URL: nats://nats:4222
      INVENTORY_GRPC_ADDR: inventory:9090
      LOG_FORMAT: text
    ports:
      - "9092:9090" # gRPC
      - "8083:8080" # health endpoints
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      inventory:
        condition: service_started

volumes:
  nats-data:
  postgres-data:
