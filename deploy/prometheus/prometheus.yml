# Prometheus configuration for the local stack (docker compose).
# Scrape and evaluation intervals are short so dashboards and alerts react
# within seconds when you try the system; use 15s or more in a real deployment.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The five backend services serve /metrics on their internal HTTP port.
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: ["inventory:8080"]
        labels: { service: inventory-service }
      - targets: ["payment:8080"]
        labels: { service: payment-service }
      - targets: ["order:8080"]
        labels: { service: order-service }
      - targets: ["notification:8080"]
        labels: { service: notification-service }

  # The gateway's public port never serves /metrics; it has its own internal one.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9100"]
        labels: { service: api-gateway }
