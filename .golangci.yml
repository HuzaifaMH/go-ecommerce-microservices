version: "2"

run:
  timeout: 5m
  # Also lint the end-to-end tests, which are excluded from normal builds.
  build-tags:
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
