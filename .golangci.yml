version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    depguard:
      rules:
        # Services must communicate over gRPC/JetStream, never by importing each other.
        inventory:
          files: ["**/internal/inventory/**"]
          deny:
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/order
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/payment
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/notification
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/gateway
              desc: services must not import each other
        order:
          files: ["**/internal/order/**"]
          deny:
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/inventory
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/payment
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/notification
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/gateway
              desc: services must not import each other
        payment:
          files: ["**/internal/payment/**"]
          deny:
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/inventory
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/order
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/notification
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/gateway
              desc: services must not import each other
        notification:
          files: ["**/internal/notification/**"]
          deny:
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/inventory
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/order
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/payment
              desc: services must not import each other
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/gateway
              desc: services must not import each other
        gateway:
          files: ["**/internal/gateway/**"]
          deny:
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/inventory
              desc: the gateway talks to services over gRPC only
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/order
              desc: the gateway talks to services over gRPC only
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/payment
              desc: the gateway talks to services over gRPC only
            - pkg: github.com/HuzaifaMH/go-ecommerce-microservices/internal/notification
              desc: the gateway talks to services over gRPC only
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
